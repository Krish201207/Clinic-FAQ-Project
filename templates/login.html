{% extends 'base.html' %}{% block body %}
<main class="auth auth-login">
  <div class="auth-brand"><span class="auth-mark">✚</span><span><b>GREENFIELD</b><small>HOSPITAL & MEDICAL CENTER</small></span></div>
  <span class="auth-kicker">PATIENT & STAFF PORTAL</span>
  <h1>Welcome back</h1><p class="auth-subtitle">Sign in to continue to your hospital workspace.</p>
  <form method="post" autocomplete="on">
    <label>Email address<input name="email" type="email" autocomplete="username" placeholder="you@example.com" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label>
    <button type="submit">Sign in <span>→</span></button>
  </form>
  <p class="auth-switch">New patient? <a href="{{ url_for('register') }}">Create an account</a></p>
</main>{% endblock %}
