<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greenfield Hospital</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="top"><a class="brand" href="/">Greenfield <b>Hospital</b></a><div class="who">{{ user.name if user else '' }}{% if user %} · {{ user.role|title }} · <a href="/history">Chat history</a> · <a href="/logout">Log out</a>{% endif %}</div></header>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</body></html>
