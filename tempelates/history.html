{% extends 'base.html' %}{% block body %}<main class="wrap"><section class="panel active"><div class="section-head"><h2>Your chatbot history</h2><a href="/">Back to dashboard</a></div><p class="note">Only conversations saved under your signed-in account are shown here. Classification is stored as analysis metadata; it does not control the chatbot response.</p><div id="history-list" class="list">Loading history…</div></section></main><script>
(async()=>{const box=document.getElementById('history-list');try{const r=await fetch('/api/chat-history');const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load history');box.innerHTML=(d.history||[]).map(x=>`<article><div><b>${String(x.question).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</b><small>${x.created_at} · ${x.topic} · Classification: ${x.classification}</small><p>${String(x.answer).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</p></div></article>`).join('')||'<p>No saved chatbot conversations yet.</p>'}catch(e){box.textContent=e.message}})();
</script>{% endblock %}
